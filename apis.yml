aid: 2eyesvision
name: 2Eyes Vision
description: '2EyesVision (2Eyes Vision, S.L.) is a Madrid, Spain based ophthalmic and
  optical technologies company, founded as a spin-off of the Spanish National Research
  Council (CSIC) out of the Visual Optics and Biophotonics Lab. It designs, manufactures
  and sells SimVis Gekko, a binocular visual simulator built on tunable liquid-lens
  temporal multiplexing that lets a patient experience premium presbyopia and cataract
  corrections - monofocal, EDOF, trifocal, monovision and mix-and-match intraocular
  lens designs - before implantation or refractive surgery. The device is CE, UKCA and
  FCC marked, is controlled from a wireless iPad, is cloud-connected for remote app and
  lens-simulation updates, and is distributed across 18 countries on 4 continents.
  2EyesVision publishes no public API, SDK, webhook surface or developer program: the
  product is an end-user clinical instrument, and the only machine-readable document it
  serves is an SEO-generated llms.txt.'
